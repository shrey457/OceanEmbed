# OceanEmbed Configuration

region:
  lat_min: 5.0
  lat_max: 30.0
  lon_min: 45.0
  lon_max: 105.0
  resolution: 0.25  # degrees

depths:
  levels: [0, 5, 10, 20, 30, 50, 75, 100, 125, 150, 200, 300, 500, 700, 1000]

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  
model:
  in_channels: 7  # SST, SSS, SSH, U_curr, V_curr, U_wind, V_wind
  out_channels: 15 # Output depths
  
training:
  batch_size: 8
  learning_rate: 0.001
  epochs: 50
  device: "cuda" # or "cpu"
